[project]
name = "mailroom-live"
version = "0.1.0"
description = "Mailroom Live: a learning project for Agent Factory Chapter 13 (Programming Fundamentals)"
readme = "README.md"
requires-python = ">=3.15"
dependencies = []

[project.scripts]
mailroom-live = "mailroom_live:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.15"
